name: Import official BASE contracts into LeadPilot
on:
  push:
    branches: ["migration/**"]
    paths:
      - "scripts/import-base-contracts.py"
      - "scripts/profile-contract-data.py"
      - "scripts/check-sources.mjs"
      - ".github/workflows/import-base-contracts.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only parse and count records; do not write to D1"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh official BASE source manifest
        run: node scripts/check-sources.mjs > data/source-manifest.json
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate importer
        run: python -m py_compile scripts/import-base-contracts.py scripts/profile-contract-data.py
      - name: Parse and import rolling five-year records
        env:
          LEADPILOT_DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run }}
          LEADPILOT_WORKER_URL: ${{ secrets.LEADPILOT_WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scripts/import-base-contracts.py
