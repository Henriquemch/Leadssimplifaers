name: Import official BASE contracts into LeadPilot
on:
  push:
    branches: ["migration/**"]
    paths:
      - "scripts/import-base-contracts.py"
      - "scripts/profile-contract-data.py"
      - ".github/workflows/import-base-contracts.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only parse and count records; do not write to D1"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh official BASE source manifest
        run: node scripts/check-sources.mjs > data/source-manifest.json
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Validate importer
        run: python -m py_compile scripts/import-base-contracts.py scripts/profile-contract-data.py
      - name: Parse rolling 12-month BASE records
        env:
          LEADPILOT_DRY_RUN: "false"
          LEADPILOT_MAX_RECORDS: "20"
          LEADPILOT_WORKER_URL: "https://leadpilot-api-dev.henriquemvm98.workers.dev"
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: python scripts/import-base-contracts.py

      - name: Verify records persisted in D1
        env:
          LEADPILOT_WORKER_URL: "https://leadpilot-api-dev.henriquemvm98.workers.dev"
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $INGEST_SECRET" \
            "$LEADPILOT_WORKER_URL/internal/import/stats")"
          echo "$response"
          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(data);
              if (result.ok !== true || result.discovery_profiles < 20 || result.discovery_contracts < 20) {
                console.error("D1 verification failed: expected at least 20 profiles and 20 contract participations.");
                process.exit(1);
              }
              console.log("D1 verification passed: imported records are persisted.");
            });
          '
