name: LeadPilot parser and D1 foundation tests
on:
  push:
    branches: [main, "migration/**"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "migrations/**"
      - "worker/**"
      - "netlify/**"
      - "index.html"
      - "netlify.toml"
      - "AUTH_SETUP.md"
      - "wrangler.toml"
      - ".github/workflows/test-parser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check openpyxl
      - run: python -m py_compile scripts/profile-contract-data.py scripts/import-base-contracts.py
      - run: python -m unittest discover -s tests -v
      - name: Validate D1 SQLite migration
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect(":memory:")
          db.executescript(open("migrations/0001_initial.sql", encoding="utf-8").read())
          db.executescript(open("migrations/0002_prospecting_workflow.sql", encoding="utf-8").read())\n          db.executescript(open("migrations/0003_remove_raw_procurement_payload.sql", encoding="utf-8").read())\n          db.executescript(open("migrations/0004_multi_company_procurements.sql", encoding="utf-8").read())
          names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          expected = {"companies", "procurements", "decision_makers", "approval_events", "import_runs", "source_files"}
          assert expected <= names, (expected - names)
          company_columns = {row[1] for row in db.execute("PRAGMA table_info(companies)")}
          assert {"qualification_status", "customer_status", "contacted_status", "active_process_status", "commercial_status"} <= company_columns
          assert "company_events" in names\n          procurement_columns = {row[1] for row in db.execute("PRAGMA table_info(procurements)")}\n          assert "source_record" not in procurement_columns\n          assert {"source_id", "company_id", "participant_role"} <= procurement_columns
          print("D1 schema and prospecting workflow OK:", ", ".join(sorted(expected)))
          PY
      - name: Validate Worker JavaScript syntax
        run: node --check worker/index.mjs
      - name: Run application and API tests
        run: node --test tests/*.test.mjs
