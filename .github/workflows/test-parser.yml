name: LeadPilot parser tests
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/test-parser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl
      - run: python -m py_compile scripts/profile-contract-data.py
      - run: python -m unittest discover -s tests -v
