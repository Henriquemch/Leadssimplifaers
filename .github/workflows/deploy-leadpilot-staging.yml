name: Deploy LeadPilot staging Worker and D1 migrations
# Staging deployment only; keep resources within the existing free-tier setup.

on:
  push:
    branches:
      - migration/cloudflare-d1-foundation
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-leadpilot-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadpilot-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/migration/cloudflare-d1-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          wrangler whoami

      - name: Apply D1 migrations to the staging database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply leadpilot --remote --config wrangler.toml

      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml

      - name: Smoke test staging API
        run: |
          response="$(curl --fail --silent --show-error https://leadpilot-api-dev.henriquemvm98.workers.dev/health)"
          echo "$response"
          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(data);
              if (result.ok !== true || result.database_configured !== true) {
                console.error("Health check failed: D1 binding is not confirmed.");
                process.exit(1);
              }
              console.log("Health check passed: Worker responds and D1 binding is present.");
            });
          '
