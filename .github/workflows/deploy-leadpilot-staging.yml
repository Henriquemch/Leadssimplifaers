name: Deploy LeadPilot staging Worker and D1 migrations
# Staging deployment only; keep resources within the existing free-tier setup.

on:
  push:
    branches:
      - migration/cloudflare-d1-foundation
    paths:
      - "worker/**"
      - "migrations/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-leadpilot-staging.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Aplicar migrações D1 (apenas quando necessário e validado)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: leadpilot-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/migration/cloudflare-d1-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          wrangler whoami

      - name: List D1 migrations on staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations list leadpilot --remote --config wrangler.toml

      - name: Apply pending D1 migrations to the staging database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply leadpilot --remote --config wrangler.toml
      - name: Verify live D1 write-path schema (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== companies ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "PRAGMA table_info(companies)"
          echo "=== decision_makers ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "PRAGMA table_info(decision_makers)"
          echo "=== lead_registry ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "PRAGMA table_info(lead_registry)"
          echo "=== company_events ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "PRAGMA table_info(company_events)"
          echo "=== validate SABI UPDATE statement (EXPLAIN only) ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "EXPLAIN UPDATE companies SET linkedin_status='not_found', contact_research_status='sabi_pending', updated_at=CURRENT_TIMESTAMP WHERE id='__diagnostic__'"
          echo "=== validate lead INSERT statements (EXPLAIN only) ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "EXPLAIN INSERT INTO lead_registry (nif,name) VALUES ('000000001','diagnostic')"
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "EXPLAIN INSERT INTO companies (id,nif,name,source_url,evidence_type,contract_count,awardee_contract_count,competitor_contract_count,awarded_value_total,latest_contract_date,top_cpv_json,top_authorities_json,recent_contracts_json) VALUES ('__diagnostic__','000000001','diagnostic',NULL,'awardee',0,0,0,0,NULL,'[]','[]','[]')"
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "EXPLAIN INSERT INTO company_events (id,company_id,event_type,summary) VALUES ('__diagnostic__','__diagnostic__','qualification_changed','diagnostic')"
          echo "=== validate decision-maker INSERT (EXPLAIN only) ==="
          wrangler d1 execute leadpilot --remote --config wrangler.toml --command "EXPLAIN INSERT INTO decision_makers (id,company_id,full_name,job_title,email,phone,contact_type,review_status,notes,professional_profile_url,source_url,provider) VALUES ('__diagnostic__','__diagnostic__','diagnostic',NULL,NULL,NULL,'decision_maker','pending',NULL,NULL,NULL,'manual')"
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --config wrangler.toml

      - name: Smoke test staging API
        run: |
          response="$(curl --fail --silent --show-error https://leadpilot-api-dev.henriquemvm98.workers.dev/health)"
          echo "$response"
          echo "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const result = JSON.parse(data);
              if (result.ok !== true || result.database_configured !== true) {
                console.error("Health check failed: D1 binding is not confirmed.");
                process.exit(1);
              }
              console.log("Health check passed: Worker responds and D1 binding is present.");
            });
          '
